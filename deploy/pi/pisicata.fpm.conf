[pisicata]
user = pisicata
group = pisicata
listen = /run/php/pisicata.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0600

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 15s
pm.max_requests = 400
catch_workers_output = yes

php_admin_flag[display_errors] = off
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 8M
